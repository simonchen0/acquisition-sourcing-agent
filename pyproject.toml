[project]
name = "acquisition-sourcing-agent"
version = "0.1.0"
description = "Local acquisition sourcing and evidence-based investment evaluation (no sign-in)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "sqlalchemy>=2.0,<3",
  "python-dotenv>=1.0,<2", "pydantic>=2.10,<3", "httpx>=0.28,<1",
  "jinja2>=3.1,<4", "python-multipart>=0.0.20,<1", "openpyxl>=3.1,<4",
  "pypdf>=5,<7", "cryptography>=44,<47"
]
[dependency-groups]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8"]
[tool.pytest.ini_options]
testpaths = ["tests"]
